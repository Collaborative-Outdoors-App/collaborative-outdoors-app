AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Authenticated group chat API backed by DynamoDB.

Parameters:
  FirebaseProjectId:
    Type: String
    Description: Firebase project ID used as the issuer and audience for Firebase ID tokens.
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:8081
    Description: Comma-separated browser origins allowed by API Gateway CORS.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    CodeUri: .
    Environment:
      Variables:
        GROUP_CHAT_TABLE: !Ref GroupChatTable
        FIREBASE_PROJECT_ID: !Ref FirebaseProjectId

Resources:
  GroupChatApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: FirebaseAuthorizer
        Authorizers:
          FirebaseAuthorizer:
            FunctionArn: !GetAtt FirebaseAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization

  FirebaseAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorizer.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/authorizer.js
        Bundle: true
        Minify: true
        Target: node22
        Format: cjs
        Sourcemap: false

  GroupChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt GroupChatTable.Arn
                - !Sub "${GroupChatTable.Arn}/index/*"
      Events:
        ListGroups:
          Type: HttpApi
          Properties:
            ApiId: !Ref GroupChatApi
            Path: /groups
            Method: GET
        CreateGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref GroupChatApi
            Path: /groups
            Method: POST
        AddGroupMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref GroupChatApi
            Path: /groups/{groupId}/members
            Method: POST
        ListMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref GroupChatApi
            Path: /groups/{groupId}/messages
            Method: GET
        SendMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref GroupChatApi
            Path: /groups/{groupId}/messages
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.js
        Bundle: true
        Minify: true
        Target: node22
        Format: cjs
        Sourcemap: false

  GroupChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserGroupsIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  GroupChatApiUrl:
    Description: API Gateway base URL for the group chat service.
    Value: !Sub "https://${GroupChatApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  GroupChatTableName:
    Description: DynamoDB single-table name.
    Value: !Ref GroupChatTable
